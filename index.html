<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>How I met a Pingu 🐧</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐧</text></svg>">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>

<!-- Lang switch -->
<div class="lang-switch" id="langSwitch" title="Switch language">
  <span class="lang-opt" data-lang="fr">FR</span>
  <span class="lang-slider"></span>
  <span class="lang-opt" data-lang="en">EN</span>
</div>

<!-- Theme switch -->
<div class="theme-switch" id="themeSwitch" title="Toggle theme">
  <span class="theme-opt" data-theme="dark">🌙</span>
  <span class="theme-slider"></span>
  <span class="theme-opt" data-theme="light">☀️</span>
</div>

<div class="app-wrapper">

  <!-- Header -->
  <header class="app-header">
    <h1><span>How I met a Pingu</span> &nbsp;🐧</h1>
    <p class="subtitle" data-i18n="subtitle"></p>
  </header>

  <!-- Actions -->
  <div class="action-bar">
    <button id="toggleBtn" class="btn btn-rules">
      <span class="mdi mdi-book-open-variant"></span>
      <span data-i18n="rulesBtn"></span>
    </button>
    <button id="rollDice" class="btn btn-roll">
      <span class="mdi mdi-dice-multiple"></span>
      <span data-i18n="rollBtn"></span>
    </button>
  </div>

  <!-- Rules Panel -->
  <div id="panel" class="rules-panel">
    <div class="rules-meta">
      <span><span class="mdi mdi-account-multiple"></span> <span data-i18n="players"></span></span>
      <span><span class="mdi mdi-clock-outline"></span> 15–30 min</span>
    </div>
    <p data-i18n="rulesIntro"></p>
    <p><span data-i18n="rulesHow"></span><span class="no-mobile" data-i18n="rulesHowDesktop"></span> :</p>
    <ul>
      <li><span class="mdi mdi-dice-1-outline"></span> <span data-i18n="dice1rule"></span><span class="no-mobile" data-i18n="dice1example"></span></li>
      <li><span class="mdi mdi-dice-2-outline"></span> <span data-i18n="dice2rule"></span><span class="no-mobile" data-i18n="dice2example"></span></li>
      <li><span class="mdi mdi-dice-3-outline"></span> <span data-i18n="dice3rule"></span><span class="no-mobile" data-i18n="dice3example"></span></li>
      <li><span class="mdi mdi-dice-4-outline"></span> <span data-i18n="dice4rule"></span><span class="no-mobile" data-i18n="dice4example"></span></li>
      <li><span class="mdi mdi-dice-5-outline"></span> <span data-i18n="dice5rule"></span><span class="no-mobile" data-i18n="dice5example"></span></li>
      <li><span class="mdi mdi-dice-6-outline"></span> <span data-i18n="dice6rule"></span><span class="no-mobile" data-i18n="dice6example"></span></li>
    </ul>
    <div class="rules-gnou">
      <img src="./gnou.png" alt="Exemple de partie" id="gnouImg" class="zoomable">
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox" role="dialog" aria-modal="true">
      <button class="lightbox-close" id="lightboxClose" aria-label="Fermer">
        <span class="mdi mdi-close"></span>
      </button>
      <img src="./gnou.png" alt="Exemple de partie" class="lightbox-img">
    </div>

    <p class="rules-variant"><b data-i18n="variantTitle"></b> <span data-i18n="variantText"></span> <span class="mdi mdi-dice-1" style="color:#ccc"></span> <span data-i18n="variantText2"></span></p>
  </div>

  <!-- Start sentence -->
  <div id="start"></div>

  <!-- Dice row -->
  <div class="dice-row">
    <div id="yellow"     class="dice-card yellow"><span class="dice-num" data-i18n="num1"></span></div>
    <span class="mdi mdi-arrow-right dice-arrow"></span>
    <div id="orange"     class="dice-card orange"><span class="dice-num" data-i18n="num2"></span></div>
    <span class="mdi mdi-arrow-right dice-arrow"></span>
    <div id="red"        class="dice-card red"><span class="dice-num" data-i18n="num3"></span></div>
    <span class="mdi mdi-arrow-right dice-arrow"></span>
    <div id="purple"     class="dice-card purple"><span class="dice-num" data-i18n="num4"></span></div>
    <span class="mdi mdi-arrow-right dice-arrow"></span>
    <div id="light-blue" class="dice-card lblue"><span class="dice-num" data-i18n="num5"></span></div>
    <span class="mdi mdi-arrow-right dice-arrow"></span>
    <div id="blue"       class="dice-card blue"><span class="dice-num" data-i18n="num6"></span></div>
  </div>

  <!-- Black dice -->
  <div class="black-section">
    <div id="rollBlackDices">
      <button id="blackButton" class="btn-black">
        <span class="mdi mdi-dice-1"></span> <span data-i18n="blackBtn"></span>
      </button>
    </div>
    <div id="blackDices"></div>
  </div>

  <!-- Footer -->
  <footer class="app-footer">
    <p>© <i>Comment j'ai adopté un Gnou</i></p>
    <p>© 2024 webapp v1.4 — made by <i>@metanef</i></p>
  </footer>

</div>

<script src="./script.js"></script>
</body>
</html>
